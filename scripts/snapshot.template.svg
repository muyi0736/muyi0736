<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="250" viewBox="0 0 880 250">
  <defs>
    <filter id="cardShadow" x="-6%" y="-12%" width="112%" height="132%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3b3324" flood-opacity="0.13"/>
    </filter>
  </defs>

  <text x="4" y="23" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#2b2a25">GitHub snapshot</text>
  <path d="M4 30C58 28 118 31 176 29" fill="none" stroke="#c85533" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <text x="876" y="21" text-anchor="end" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.4" fill="#9a907b">{{UPDATED}}</text>

  <g filter="url(#cardShadow)">
    <rect x="0.5" y="38.5" width="395" height="195" rx="12" fill="#f8f2e4" stroke="#d6c9b2"/>
    <rect x="416.5" y="38.5" width="463" height="195" rx="12" fill="#f8f2e4" stroke="#d6c9b2"/>
  </g>

  <g transform="rotate(-3.5 46 38)">
    <rect x="18" y="31" width="56" height="13" fill="#e9d399" opacity="0.62"/>
  </g>
  <g transform="rotate(2.6 450 38)">
    <rect x="424" y="31" width="48" height="13" fill="#e9d399" opacity="0.52"/>
  </g>

  <!-- left card -->
  <text x="24" y="74" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#2b2a25">Open source</text>
  <text x="24" y="92" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.4" fill="#9a907b">PUBLIC REPOSITORIES</text>

  <text x="24" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#2b2a25">{{STARS}}</text>
  <text x="24" y="152" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.6" fill="#9a907b">STARS</text>

  <text x="145" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#2b2a25">{{FOLLOWERS}}</text>
  <text x="145" y="152" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.6" fill="#9a907b">FOLLOWERS</text>

  <text x="258" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#2b2a25">{{REPOS}}</text>
  <text x="258" y="152" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.6" fill="#9a907b">PUBLIC REPOS</text>

  <text x="24" y="214" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.2" fill="#a49a86">{{STATE}}</text>

  <!-- right card -->
  <text x="440" y="74" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#2b2a25">Primary languages</text>
  <text x="440" y="92" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.4" fill="#9a907b">SHARE OF PUBLIC REPO BYTES</text>

<!-- LANG_ROWS -->

  <text x="440" y="216" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.2" fill="#a49a86">TOP 4 · OTHER AGGREGATED</text>
